services:
  app:
    image: bitnami/laravel:latest
    entrypoint: []
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=cambly
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # Use the password from .env so it's not visible in Git
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=cambly
      - MYSQL_ROOT_HOST=%
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_HOST=db
      # We keep these removed so it asks for login (Security)
      # - PMA_USER=${DB_USERNAME}
      # - PMA_PASSWORD=${DB_PASSWORD}
      - PMA_ABSOLUTE_URI=https://cambly.devifyo.cloud/dbase/
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db

volumes:
  db_data: