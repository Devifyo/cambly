version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cambly_app
    restart: unless-stopped
    working_dir: /var/www
    # Using root to avoid permission issues as per your previous config
    user: "root"
    volumes:
      - ./:/var/www
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      - APP_KEY=${APP_KEY}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - default
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: cambly_web
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      # CRITICAL FIX: Maps host port 8001 to container port 80
      - "127.0.0.1:8001:80"
    networks:
      - web_network
      - default
    depends_on:
      - app

  db:
    image: mariadb:10.6
    container_name: cambly_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default

  phpmyadmin:
    image: phpmyadmin
    container_name: cambly_pma
    environment:
      - PMA_HOST=db
      - PMA_ABSOLUTE_URI=https://cambly.devifyo.cloud/dbase/
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - default
      - web_network
    depends_on:
      - db

volumes:
  db_data:

networks:
  web_network:
    external: true