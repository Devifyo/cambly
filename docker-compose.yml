services:
  app:
    image: bitnami/laravel:latest
    entrypoint: []
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=cambly
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./:/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=InnoDB
      --innodb-file-per-table=1
    environment:
      # Use the password from .env so it's not visible in Git
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=cambly
      - MYSQL_ROOT_HOST=%
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_ABSOLUTE_URI=https://cambly.devifyo.cloud/dbase/
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Mount your custom ini file to the PHP conf.d directory
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - db

volumes:
  db_data: